<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operativo Visita Papa 2026 - DGDN</title>
    <!-- Fuente institucional -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de color institucionales extraídas del escudo */
        :root {
            --azul-oscuro: #0B1B36;
            --azul-institucional: #16324F;
            --dorado: #D4AF37;
            --dorado-oscuro: #B08D57;
            --blanco: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, var(--azul-institucional) 0%, var(--azul-oscuro) 100%);
            color: var(--blanco);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        /* Contenedor principal animado */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Efecto Radar detrás del escudo */
        .logo-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: inline-block;
        }

        .logo-wrapper::before,
        .logo-wrapper::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid var(--dorado);
            opacity: 0;
            z-index: -1;
        }

        .logo-wrapper::before {
            width: 100%;
            height: 100%;
            animation: radarPulse 3s ease-out infinite;
        }

        .logo-wrapper::after {
            width: 100%;
            height: 100%;
            animation: radarPulse 3s ease-out infinite 1.5s;
        }

        /* El Escudo */
        .escudo {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.2);
            animation: float 6s ease-in-out infinite;
            display: block;
            object-fit: cover;
        }

        /* Títulos */
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--dorado);
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            line-height: 1.1;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--blanco);
            margin-bottom: 40px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Botón Gigante */
        .btn-main {
            display: inline-block;
            background: linear-gradient(135deg, var(--dorado) 0%, var(--dorado-oscuro) 100%);
            color: var(--azul-oscuro);
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            padding: 22px 60px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        /* Efecto de brillo al pasar el mouse */
        .btn-main::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.2);
            transform: rotate(45deg) translateY(-100%);
            transition: transform 0.6s;
        }

        .btn-main:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.6);
            color: var(--azul-oscuro);
        }

        .btn-main:hover::after {
            transform: rotate(45deg) translateY(100%);
        }

        /* Animaciones */
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes radarPulse {
            0% { width: 100%; height: 100%; opacity: 0.8; }
            100% { width: 200%; height: 200%; opacity: 0; }
        }

        /* Responsive para celulares */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1rem; letter-spacing: 2px; margin-bottom: 30px; }
            .escudo { width: 170px; height: 170px; }
            .btn-main { font-size: 1.2rem; padding: 18px 40px; width: 90vw; max-width: 350px;}
        }
    </style>
</head>
